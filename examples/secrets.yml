# Secrets and environment handling.
#
#   printf 'API_TOKEN=replace-with-your-token\n' > .forge/secrets.env
#   chmod 600 .forge/secrets.env
#   forge run examples/secrets.yml
#   forge logs <run-id>     # the value is masked, everywhere
#
# Secrets are read from .forge/secrets.env (and any host variables named in
# secrets.env config). They are injected into job environments, masked in
# captured output before anything reaches disk, and never written to the
# database.

name: secrets

jobs:
  # Receives every loaded secret.
  uses-all-secrets:
    commands:
      - echo "the value below is redacted in the stored log"
      - 'echo "token is ${API_TOKEN:-<not set>}"'

  # Receives only what it names, which is the safer habit.
  scoped:
    secrets: [API_TOKEN]
    commands:
      - echo "this job can read API_TOKEN and nothing else"

  # The host environment is not inherited: only variables listed in
  # runner.env_passthrough come through.
  isolated-env:
    commands:
      - 'echo "PATH is passed through: ${PATH}"'
      - 'echo "an unlisted host variable is empty: [${HOME_SECRET:-}]"'
